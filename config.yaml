app:
  host: 127.0.0.1
  port: 8000
  debug: true

nlp_to_sql:
  engine: agent   # options: rule_based | hf | agent
  hf_model: Ellbendls/Qwen-2.5-3b-Text_to_SQL  # used only when engine==hf
  agent_model_id: meta-llama/Llama-3.1-8B-Instruct  # used only when engine==agent
  temperature: 0.0
  max_new_tokens: 128

database:
  driver: sqlite
  path: data/rental_app.db
  init_sql: data/rental_app.sql

answers:
  fallback_message: "Sorry, unable to answer at this point in time."
  numeric_tolerance: 0.01
